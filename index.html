<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Encuesta: Remodelación y Mantenimiento del Hogar</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <h1>Remodelación, Arquitectura y Mantenimiento del Hogar</h1>
  <p class="subtitulo">
    Encuesta para la materia de Minería de Datos. Tus respuestas son anónimas
    y se usan únicamente con fines estadísticos y académicos.
  </p>

  <nav class="navegacion">
    <a href="resultados.html">Ver resultados en tiempo real →</a>
  </nav>

  <form id="form-encuesta">

    <!-- ============ DATOS BÁSICOS ============ -->
    <fieldset>
      <legend>Datos básicos</legend>

      <label for="edad">Edad</label>
      <input type="number" id="edad" name="edad" min="15" max="99" required />

      <p><strong>Sexo</strong></p>
      <div id="contenedor-sexo"><!-- Se llena dinámicamente con app.js a partir de OPCIONES_SEXO --></div>
    </fieldset>

    <!-- ============ 6 PREGUNTAS CERRADAS (se generan dinámicamente) ============ -->
    <div id="contenedor-preguntas-cerradas">
      <!-- app.js recorre PREGUNTAS_CERRADAS (definidas en preguntas.js) y
           construye un <fieldset> con 4 radio buttons por cada pregunta. -->
    </div>

    <!-- ============ 2 PREGUNTAS ABIERTAS (se generan dinámicamente) ============ -->
    <div id="contenedor-preguntas-abiertas">
      <!-- app.js recorre PREGUNTAS_ABIERTAS y construye un <textarea> por cada una. -->
    </div>

    <button type="submit" id="btn-enviar">Enviar encuesta</button>
    <p id="mensaje-estado"></p>
  </form>

  <!-- SDKs de Firebase (versión "compat", la más sencilla de usar directo en HTML) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <!-- Nuestros archivos, en este orden: config -> catálogo de preguntas -> lógica -->
  <script src="config.js"></script>
  <script src="preguntas.js"></script>
  <script src="app.js"></script>
</body>
</html>
